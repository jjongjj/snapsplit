schema_version = "1.0.0"

# SplitForge is a GPL fork of SnapSplit by Christoph Medicus (Betakontext),
# https://github.com/Betakontext/snapsplit. "SplitForge" is a temporary working
# name: renaming means changing `id`/`name` here, the package folder name and the
# constants in core/naming.py.
id = "splitforge"
version = "0.4.0"
name = "SplitForge"
tagline = "Non-destructive cut stacks and connectors for 3D printing"
# SplitForge fork maintainer; the upstream author is credited in `copyright` below
maintainer = "jjongjj <https://github.com/jjongjj/snapsplit>"
website = "https://github.com/jjongjj/snapsplit"
issues = "https://github.com/jjongjj/snapsplit"
type = "add-on"
# Supported and tested: Blender 5.2 only (user decision 2026-10-10)
blender_version_min = "5.2.0"
tags = ["Modeling", "Mesh", "Object", "Import-Export"]
license = ["SPDX:GPL-3.0-or-later"]
copyright = [
  "2026 Christoph Medicus (SnapSplit)",
  "2026 SplitForge contributors",
]

[build]
# Release zip: the add-on only (no caches, editor or OS clutter)
paths_exclude_pattern = [
  "__pycache__/",
  "*.pyc",
  "/.git/",
  "*.blend1",
  ".DS_Store",
  "Thumbs.db",
]
